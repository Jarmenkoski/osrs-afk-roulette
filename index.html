<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OSRS AFK Roulette</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎡</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>⚔️ OSRS AFK Roulette 🎡</h1>
      <p class="subtitle">Spin the wheel for today's AFK task!</p>
    </header>

    <section class="panel" id="setup-panel">
      <div class="input-row">
        <div class="field">
          <label for="nick">OSRS username</label>
          <input type="text" id="nick" name="osrs-nick" placeholder="e.g. Zezima" autocomplete="nickname" autocapitalize="off" spellcheck="false">
        </div>
        <button id="fetch-btn" class="btn btn-secondary">Fetch levels</button>
      </div>
      <div class="options-row">
        <label class="checkbox-label">
          <input type="checkbox" id="f2p-only"> F2P tasks only
        </label>
      </div>
      <div id="fetch-status" class="status hidden"></div>
    </section>

    <section class="panel hidden" id="skills-panel">
      <h2 id="skills-title">Levels</h2>
      <div id="skills-grid" class="skills-grid"></div>
      <p id="eligible-count" class="eligible-count"></p>
    </section>

    <section class="wheel-section hidden" id="wheel-section">
      <div class="wheel-wrap">
        <div class="pointer">▼</div>
        <canvas id="wheel" width="520" height="520"></canvas>
      </div>
      <button id="spin-btn" class="btn btn-primary">🎰 Generate today's task!</button>
    </section>

    <section class="panel result-panel hidden" id="result-panel">
      <h2>📜 Today's AFK Task</h2>
      <div id="result-card" class="result-card"></div>
      <div class="result-actions">
        <button id="done-btn" class="btn btn-done">✅ Mark as done</button>
        <button id="discord-btn" class="btn btn-discord">📨 Send to Discord</button>
        <button id="reroll-btn" class="btn btn-secondary">⏭️ Skip &amp; spin again</button>
      </div>
      <div id="discord-status" class="status hidden"></div>
    </section>

    <section class="panel hidden" id="leaderboard-panel">
      <h2>🌍 Shared Leaderboard</h2>
      <div id="leaderboard"></div>
    </section>

    <section class="panel hidden" id="stats-panel">
      <h2>🏆 Highscores</h2>
      <div id="stats-grid" class="stats-grid"></div>
      <h3 class="stats-subtitle">Tasks done per skill</h3>
      <div id="skill-stats" class="skill-stats"></div>
      <h3 class="stats-subtitle">History</h3>
      <div id="history-list" class="history-list"></div>
    </section>

    <footer>
      <p>Tasks: <a href="https://oldschool.runescape.wiki/w/Guide:AFK_Skilling_Methods" target="_blank" rel="noopener">OSRS Wiki – AFK Skilling Methods</a>
      · Levels: <a href="https://wiseoldman.net" target="_blank" rel="noopener">Wise Old Man</a> / OSRS Hiscores</p>
    </footer>
  </div>

  <script src="tasks.js"></script>
  <script src="app.js"></script>
</body>
</html>
