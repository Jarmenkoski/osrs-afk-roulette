<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Generator — TEST</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>">
  <link rel="stylesheet" href="style.css">
  <style>
    .tier-btns { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .tier-btn { flex: 1; min-width: 100px; }
    .tier-btn.active { outline: 2px solid var(--gold); }
    .task-row { background: #221a13; border-radius: 5px; padding: 7px 10px; margin-bottom: 4px; font-size: 0.9rem; }
    .task-row a { color: var(--gold); }
    .task-row .why { color: #f0a0a0; font-size: 0.82rem; margin-top: 2px; }
    .task-row .reqs { color: var(--text-dim); font-size: 0.8rem; }
    .task-row.near { border-left: 3px solid var(--gold); }
    .roll-card { background: var(--parchment); color: #2b2119; border-radius: 8px; padding: 18px; text-align: center; margin: 12px 0; }
    .roll-card .task-name { font-size: 1.3rem; font-weight: bold; }
    .roll-card a { color: #6a3f00; }
    .roll-card .tip { font-size: 0.9rem; margin-top: 8px; color: #5a4a30; }
    .counts { color: var(--text-dim); margin: 10px 0; }
    details summary { cursor: pointer; color: var(--gold-dim); margin: 12px 0 8px; }
    .skill-block h3 { color: var(--gold); font-size: 1rem; margin: 14px 0 6px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🧪 Task Generator — TEST</h1>
      <p class="subtitle">Task = level-based skill tasks · Bosses = level-appropriate bosses · Collection = Taskman log tasks</p>
    </header>

    <section class="panel">
      <div class="input-row">
        <div class="field">
          <label for="nick">OSRS username</label>
          <input type="text" id="nick" placeholder="e.g. VahvaJaakko" autocomplete="nickname" spellcheck="false">
        </div>
        <button id="load-btn" class="btn btn-secondary">Load</button>
      </div>
      <div class="tier-btns">
        <button class="btn btn-secondary tier-btn active" data-cat="task">📋 Task</button>
        <button class="btn btn-secondary tier-btn" data-cat="boss">⚔️ Bosses</button>
        <button class="btn btn-secondary tier-btn" data-cat="collection">📚 Collection</button>
      </div>
      <button id="roll-btn" class="btn btn-primary" disabled>🎲 Roll a task</button>
      <div id="status" class="status hidden"></div>
    </section>

    <div id="roll-result"></div>

    <section class="panel" id="hs-panel">
      <h2>🏆 Tasker Highscores</h2>
      <div id="hs-table"><span class="hint">Loading…</span></div>
    </section>

    <section class="panel hidden" id="lists-panel">
      <p class="counts" id="counts"></p>
      <div id="task-lists"></div>
    </section>
  </div>

  <script>
    const API = 'https://afk-api.rosu.fi';
    const $ = (id) => document.getElementById(id);
    let cat = 'task';

    document.querySelectorAll('.tier-btn').forEach((b) => b.addEventListener('click', () => {
      document.querySelectorAll('.tier-btn').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      cat = b.dataset.cat;
      $('roll-result').innerHTML = '';
      if ($('nick').value.trim()) { load(); loadActive(); }
    }));

    function setStatus(msg, kind) {
      const el = $('status');
      el.textContent = msg; el.className = 'status ' + kind; el.classList.remove('hidden');
    }

    function fmtReqs(reqs) {
      const e = Object.entries(reqs || {});
      return e.length ? e.map(([s, l]) => `${s} ${l}`).join(', ') : 'no requirements';
    }

    async function load() {
      const nick = $('nick').value.trim();
      if (!nick) return;
      localStorage.setItem('afk_nick', nick);
      setStatus('Loading…', 'info');
      try {
        if (cat === 'task') {
          const r = await fetch(`${API}/api/tasker/task/eligible?nick=${encodeURIComponent(nick)}`);
          if (!r.ok) throw new Error((await r.json()).error || r.status);
          const d = await r.json();
          const skills = Object.entries(d.skills);
          $('counts').textContent = `Combat level ${d.combat} · ${skills.length} skills with available tasks. ` +
            `Gold-edged = "near your level" bucket (gets 50% of roll weight).`;
          $('task-lists').innerHTML = skills.map(([skill, s]) => `
            <div class="skill-block">
              <h3>${skill} — level ${s.level}</h3>
              ${s.methods.map((m) => `
                <div class="task-row ${m.near ? 'near' : ''}">
                  ${m.template.replace('{n}', `${m.lo}–${m.hi}`)}
                  <span class="reqs"> — req ${m.req}${Object.keys(m.extra).length ? ' + ' + fmtReqs(m.extra) : ''}</span>
                </div>`).join('')}
            </div>`).join('');
        } else {
          const r = await fetch(`${API}/api/tasker/eligible?nick=${encodeURIComponent(nick)}&tier=${cat}`);
          if (!r.ok) throw new Error((await r.json()).error || r.status);
          const d = await r.json();
          $('counts').textContent = `Combat level ${d.combat} · ${d.eligibleCount} eligible / ${d.blockedCount} blocked`;
          $('task-lists').innerHTML = `
            <details open><summary>✅ Eligible</summary>${d.eligible.map((t) => `
              <div class="task-row">
                ${t.wiki ? `<a href="${t.wiki}" target="_blank" rel="noopener">${t.display || t.name}</a>` : (t.display || t.name)}
                <span class="reqs"> — ${fmtReqs(t.reqs)}</span>
              </div>`).join('') || '<i>none</i>'}</details>
            <details><summary>🚫 Blocked (with reasons)</summary>${d.blocked.map((t) => `
              <div class="task-row">
                ${t.wiki ? `<a href="${t.wiki}" target="_blank" rel="noopener">${t.display || t.name}</a>` : (t.display || t.name)}
                <div class="why">Missing: ${Object.entries(t.missing).map(([s, m]) => `${s} ${m.have}/${m.need}`).join(', ')}</div>
              </div>`).join('') || '<i>none</i>'}</details>`;
        }
        $('lists-panel').classList.remove('hidden');
        $('roll-btn').disabled = false;
        $('status').classList.add('hidden');
      } catch (e) {
        setStatus('Failed: ' + e.message, 'error');
      }
    }

    function renderRollCard(name, metaLine, tip, wiki, isActive) {
      $('roll-result').innerHTML = `
        <div class="roll-card">
          <div class="task-name">${wiki ? `<a href="${wiki}" target="_blank" rel="noopener">${name}</a>` : name}</div>
          ${metaLine ? `<div class="reqs">${metaLine}</div>` : ''}
          ${tip ? `<div class="tip">💡 ${tip}</div>` : ''}
          ${isActive ? '<div class="reqs"><i>(your current task — finish or skip it)</i></div>' : ''}
          <div style="margin-top:12px; display:flex; gap:8px; justify-content:center;">
            <button class="btn btn-done" onclick="completeTask('done')">✅ Done</button>
            <button class="btn btn-secondary" onclick="completeTask('skipped')">⏭️ Skip &amp; reroll</button>
          </div>
        </div>`;
    }

    async function roll() {
      const nick = $('nick').value.trim();
      setStatus('Rolling…', 'info');
      try {
        if (cat === 'task') {
          const r = await fetch(`${API}/api/tasker/task/roll?nick=${encodeURIComponent(nick)}`);
          if (!r.ok) throw new Error((await r.json()).error || r.status);
          const d = await r.json();
          renderRollCard(d.task || d.name,
            d.skill ? `${d.skill} (your level ${d.level}, task req ${d.req}${d.near ? ', near-level' : ''})` : '',
            '', null, d.active);
        } else {
          const r = await fetch(`${API}/api/tasker/roll?nick=${encodeURIComponent(nick)}&tier=${cat}`);
          if (!r.ok) throw new Error((await r.json()).error || r.status);
          const d = await r.json();
          renderRollCard(d.task.name, fmtReqs(d.task.reqs), d.task.tip, d.task.wiki, d.active);
        }
        $('status').classList.add('hidden');
      } catch (e) {
        setStatus('Roll failed: ' + e.message, 'error');
      }
    }

    async function completeTask(status) {
      const nick = $('nick').value.trim();
      try {
        const r = await fetch(`${API}/api/tasker/complete`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nick, category: cat, status }),
        });
        if (!r.ok) throw new Error((await r.json()).error || r.status);
        $('roll-result').innerHTML = '';
        loadHighscores();
        if (status === 'skipped') {
          roll(); // skip rolls a fresh task right away
        } else {
          setStatus('✅ Task completed and logged!', 'success');
        }
      } catch (e) {
        setStatus('Failed: ' + e.message, 'error');
      }
    }

    async function loadActive() {
      const nick = $('nick').value.trim();
      if (!nick) return;
      try {
        const r = await fetch(`${API}/api/tasker/current?nick=${encodeURIComponent(nick)}&category=${cat}`);
        const d = await r.json();
        if (d.active) {
          if (cat === 'task') {
            renderRollCard(d.active.name, d.active.skill ? `${d.active.skill} (task req ${d.active.req})` : '', '', null, true);
          } else {
            renderRollCard(d.active.name, '', d.active.tip, d.active.wiki, true);
          }
        }
      } catch (_) { /* ignore */ }
    }

    async function loadHighscores() {
      try {
        const r = await fetch(`${API}/api/tasker/highscores`);
        const d = await r.json();
        const medal = (i) => ['🥇', '🥈', '🥉'][i] || `${i + 1}.`;
        const CATS = [['task', '📋 Task'], ['boss', '⚔️ Bosses'], ['collection', '📚 Collection']];
        const html = CATS.map(([key, label]) => {
          const rows = d[key] || [];
          return `
            <h3 class="stats-subtitle">${label}</h3>
            ${rows.length ? `
              <table class="lb-table">
                <thead><tr><th>#</th><th>Player</th><th>✅ Done</th><th>⏭️ Skips</th></tr></thead>
                <tbody>${rows.map((p, i) => `
                  <tr><td>${medal(i)}</td><td>${p.nick}</td><td><b>${p.done}</b></td><td>${p.skips}</td></tr>`).join('')}
                </tbody>
              </table>` : '<span class="hint">No completed tasks yet.</span>'}`;
        }).join('');
        $('hs-table').innerHTML = html;
      } catch (_) {
        $('hs-table').innerHTML = '<span class="hint">Could not load highscores.</span>';
      }
    }

    $('load-btn').addEventListener('click', () => { load(); loadActive(); });
    $('nick').addEventListener('keydown', (e) => { if (e.key === 'Enter') { load(); loadActive(); } });
    $('roll-btn').addEventListener('click', roll);
    const saved = localStorage.getItem('afk_nick');
    if (saved) $('nick').value = saved;
    loadHighscores();
  </script>
</body>
</html>
