services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8020:8000"
    volumes:
      - ./data:/data
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - DISCORD_APP_ID=${DISCORD_APP_ID:-}
      - DISCORD_PUBLIC_KEY=${DISCORD_PUBLIC_KEY:-}
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
