# /etc/nginx/sites-enabled/afk on the server (TLS lines are managed by certbot).
# Per-IP request limits: everything 10/s, the endpoints that roll tasks or look
# up hiscores 20/min. Discord interactions are left to Discord's own limits.
limit_req_zone $binary_remote_addr zone=afk_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=afk_slow:10m rate=20r/m;

server {
    server_name afk-api.rosu.fi;

    server_tokens off;
    client_max_body_size 300k;
    limit_req_status 429;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ~ ^/api/(levels|afk/today|tasker/roll|tasker/task/roll|tasker/eligible|tasker/task/eligible|plugin/group/create)$ {
        limit_req zone=afk_slow burst=20 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=afk_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/afk-api.rosu.fi/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/afk-api.rosu.fi/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = afk-api.rosu.fi) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    server_name afk-api.rosu.fi;
    server_tokens off;
    return 404; # managed by Certbot
}
